<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; }
        textarea { width: 100%; height: 100px; font-size: 14px; }
        button { margin-top: 10px; padding: 8px 16px; font-size: 14px; }
        #system_response { margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement below to find out its emotion:</p>
    <textarea id="textToAnalyze" placeholder="Type your statement here..."></textarea><br>
    <button onclick="RunSentimentAnalysis()">Analyze</button>
    <div id="system_response"></div>

    <script>
        function RunSentimentAnalysis() {
            const textToAnalyze = document.getElementById("textToAnalyze").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4) {
                    if (this.status === 200) {
                        document.getElementById("system_response").innerText = this.responseText;
                    } else {
                        document.getElementById("system_response").innerText =
                            "Invalid text! Please try again!";
                    }
                }
            };
            xhttp.open(
                "GET",
                "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze),
                true
            );
            xhttp.send();
        }
    </script>
</body>
</html>
